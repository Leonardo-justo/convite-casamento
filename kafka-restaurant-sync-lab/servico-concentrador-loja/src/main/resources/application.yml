server:
  # API local usada pelo PDV quando a internet está indisponível.
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: servico-concentrador-loja
  datasource:
    # Banco em arquivo: os dados sobrevivem ao restart da aplicação.
    url: jdbc:h2:file:${EDGE_DB_PATH:./data/edge-store};AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      # O listener confirma registros somente após o processamento.
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Consumir apenas mensagens confirmadas quando houver transações.
        isolation.level: read_committed
        max.poll.records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # concurrency é o número de consumidores dentro deste consumer group.
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  identity:
    # Cada instalação deve receber uma identidade própria de loja.
    tenant-id: ${TENANT_ID:11111111-1111-1111-1111-111111111111}
    store-id: ${STORE_ID:22222222-2222-2222-2222-222222222222}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  kafka:
    consumer-group: ${EDGE_CONSUMER_GROUP:edge-sync-store-001}
    topics:
      product-changed: ${PRODUCT_TOPIC:restaurant.catalog.product.v1}
    retry:
      delay-ms: ${KAFKA_RETRY_DELAY_MS:1000}
      max-retries: ${KAFKA_MAX_RETRIES:3}
